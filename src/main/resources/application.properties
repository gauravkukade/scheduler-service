spring.application.name=scheduler-service
server.port=8081

# Quartz ? bundled jobs.xml always loads; external path (set per-environment) overrides matching job names when present
org.quartz.plugin.jobInitializer.class=org.quartz.plugins.xml.XMLSchedulingDataProcessorPlugin
org.quartz.plugin.jobInitializer.fileNames=jobs.xml,${jobs.xml.external.path:}
org.quartz.plugin.jobInitializer.overwriteExistingJobs=true
org.quartz.plugin.jobInitializer.failOnFileNotFound=false

# springdoc / swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html